<!DOCTYPE html>
<html>

<head>
  <base target="_top">
  <script>
    let idHistoriaGlobal = null; // Aquí guardaremos el ID del Google Sheet creado

    // Función que se llama al hacer submit del formulario
      function handleSubmit(event) {
        event.preventDefault();

        const output = document.getElementById('output');
        output.textContent = 'Procesando...';

        const fileInput = document.getElementById('pdfFile');
        if (fileInput.files.length === 0) {
          alert('Por favor selecciona un archivo PDF.');
          return;
        }

        const nacionalidadInput = document.getElementById('nacionalidad');
        let nacionalidad = nacionalidadInput.value.trim();
        // Si no se ingresa nacionalidad, usar "ARGENTINA"
        if (!nacionalidad) {
          nacionalidad = "ARGENTINA";
        }

        const destinoInput = document.getElementById('destino');
        let destino = destinoInput.value.trim();
        // Si no se ingresa destino, usar "quien corresponda"
        if (!destino) {
          destino = "quien corresponda";
        }

        // Obtener opciones seleccionadas (checkboxes)
        const opciones = [];
        const checkboxes = document.querySelectorAll('input[name="opciones"]:checked');
        checkboxes.forEach(cb => opciones.push(cb.value));

        // Agregar nacionalidad y destino como opciones formateadas
        opciones.push("nacionalidad: " + nacionalidad);
        opciones.push("destino: " + destino);

        const file = fileInput.files[0];  //fileInput es una referencia al elemento <input type="file"> del formulario.
        const reader = new FileReader();  //cuando FileReader() termina de leer, se ejecuta onload
        reader.onload = function(evt) {
          const base64Data = evt.target.result.split(',')[1]; // Obtener solo base64
          console.log("FRONTEND: Llamando a backend con archivo:", file.name);
          // Llamar al backend con el contenido del archivo, la nacionalidad, destino y opciones
          google.script.run
            .withSuccessHandler(function(resultado) {
              console.log("FRONTEND: Éxito: mostrando resultado -->");
              idHistoriaGlobal=resultado.idHistoria; //guardo el idHistoria en el frontend
              displayUploadResult(resultado);
            })
            .withFailureHandler(function(err) {
              console.error("FRONTEND: Error llegada desde backend:", err);
              alert("Error del main en el front: " + err.message);
            })
            .main(file.name, base64Data, opciones);
        };

        reader.readAsDataURL(file); //readAsDataURL es función de reader; reader es un objeto de la clase FileReader
      }

      // Muestra el resultado en la web
      function displayUploadResult(resultado) {
        console.log("displayUploadResult llamada con resultado:", resultado);
        const output = document.getElementById('output');
        if (resultado.error) {
          output.innerHTML = '<span style="color:red;">Error: ' + resultado.error + '</span>';
        } else {
          const idHistoria = resultado.idHistoria || 'No disponible';
          const opciones = resultado.opciones || 'No disponible';
          const urlCarpeta = resultado.urlCarpeta || `No disponible`;
          const valoresStr = JSON.stringify(resultado.valores, null, 2);

          output.innerHTML = 
            '<strong>Archivo subido con éxito!</strong><br><br>' +
            '<strong>ID de la hoja (idHistoria):</strong> ' + idHistoria + '<br><br>' +
            '<strong>Opciones recibidas:</strong><br><pre>' + opciones + '</pre><br>' +
            '<strong>Url carpeta:</strong><br><pre>' + urlCarpeta + '</pre><br>' +
            '<strong>Datos extraídos de la hoja:</strong><br><pre>' + valoresStr + '</pre>';
        }
      }
  </script>
</head>

<body>
  <h1>Programas FA-UNC</h1>

  <!-- Formulario para subir PDF -->
  <form id="pdfForm" onsubmit="handleSubmit(event)">
    <label for="pdfFile">Sube tu analítico PDF:</label>
    <input type="file" id="pdfFile" accept="application/pdf" />
    <br><br>

    <!-- Sección de opciones con checkboxes -->
    <fieldset>
      <legend>Opciones</legend>
      <label for="nacionalidad">Nacionalidad:</label>
      <input type="text" id="nacionalidad" name="nacionalidad" placeholder="Por defecto: ARGENTINA" />
      <br>
      <label for="destino">Destino:</label>
      <input type="text" id="destino" name="destino" placeholder="Por defecto: quien corresponda. País/Institución/etc." />
      <br>
      <label><input type="checkbox" name="opciones" value="egresado"> Egresado -indica si es egresado (forzar egreso)</label><br>
      <label><input type="checkbox" name="opciones" value="plan de estudios"> Plan de estudios</label><br>
      <label><input type="checkbox" name="opciones" value="carga horaria"> Carga horaria</label><br>
      <label><input type="checkbox" name="opciones" value="escala de calificaciones"> Escala de calificaciones</label><br>
      <label><input type="checkbox" name="opciones" value="programas"> Programas</label><br>
      <label><input type="checkbox" name="opciones" value="sancionado"> Sancionado - Marcar si es. Por defecto "NO registra ninguna sanción"</label><br>
      <small><em>La hoja resumen incluye el no sanción.</em></small>
      <small><em>Para egresados no se solicita destino en el resumen.</em></small>
      <small><em>Para estudiantes debe ir destino en el resumen.</em></small>
    </fieldset>
    <br>

    <button type="submit">Procesar</button>
  </form>

  <pre id="output"></pre>
</body>

</html>
